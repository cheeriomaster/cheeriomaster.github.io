<title>待看展览 · 北京</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#1A1A1A;--sub:#6B6B68;--muted:#9A9A96;--line:#ECECEA;--bg:#FAFAF8;
--hot:#D0402C;--soon:#E07A28;--calm:#C4C4BE}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased}
header{padding:36px 22px 0;max-width:920px;margin:0 auto}
h1{font-size:21px;font-weight:700;letter-spacing:.5px}
header p{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:18px 22px 60px}

/* 顶部一行 */
.dash{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;font-size:13px;color:var(--sub)}
.dash b{color:var(--ink);font-weight:600}
.dash .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--soon);margin-right:7px;vertical-align:1.5px}

/* 筛选：一行文字标签 */
.filters{display:flex;flex-wrap:wrap;gap:0 4px;margin:14px 0 20px;border-bottom:1px solid var(--line)}
.filters button{border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;
padding:8px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.12s}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.filters button .c{font-size:11px;margin-left:4px;color:#C0C0BB}
.filters button.on .c{color:var(--sub)}

/* 卡片 */
.grid{column-count:2;column-gap:12px}
@media(max-width:720px){.grid{column-count:1}}
.card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--calm);border-radius:10px;
padding:15px 16px 12px;position:relative;transition:.15s;cursor:pointer;
break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:12px;display:inline-block;width:100%}
.card:hover{border-color:#E2E2DE;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card.lv-last,.card.lv-urgent{border-left-color:var(--hot)}
.card.lv-soon{border-left-color:var(--soon)}
.card.ended{border-left-color:#E4E4E0;opacity:.5}
.card.seen{opacity:.55}
.card h3{font-size:15px;line-height:1.45;font-weight:600;letter-spacing:.2px}
.card .num{font-size:11px;color:var(--muted);font-weight:600;margin-right:7px;letter-spacing:.5px}
.fin{font-size:12.5px;font-weight:600;color:var(--sub);margin-top:6px}
.fin.hot{color:var(--hot)}
.fin.soon{color:var(--soon)}
.meta{font-size:12.5px;color:var(--sub);line-height:1.8;margin-top:7px}
.meta .when{color:var(--muted)}
.tags{font-size:12px;color:var(--muted);margin-top:5px}
.traffic{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:.2px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.poster{display:inline-block;margin-top:11px;border-radius:6px;overflow:hidden;line-height:0;border:1px solid var(--line)}
.poster img{display:block;width:92px;height:auto}
.acts{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid #F4F4F1}
.navbtn{font-size:12.5px;font-weight:600;color:var(--ink);background:#F2F1ED;border-radius:7px;
padding:6px 13px;text-decoration:none;cursor:pointer}
.navbtn:hover{background:#EAE8E2}
.seenbtn,.skipbtn{border:0;background:none;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;padding:6px 0}
.seenbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;color:var(--ink);font-weight:600}
.seenbtn:hover{background:#F7F7F4}
.skipbtn{margin-left:auto}
.skipbtn:hover{color:var(--ink)}
.card.seen .seenbtn{background:#F7F7F4;border-color:#EAE8E2;color:var(--sub);font-weight:500}
.card.skip .skipbtn{color:var(--sub)}
.empty{color:var(--muted);font-size:13px;padding:20px 4px}

/* 地图 */
#map{height:440px;border-radius:12px;border:1px solid var(--line);margin-top:30px}
@media(max-width:720px){#map{height:340px}}
.mk{width:26px;height:26px;border-radius:50%;background:#8C8C86;color:#fff;font-weight:600;font-size:12px;
display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.mk.hot{background:var(--hot)}
.mk.soon{background:var(--soon)}
.mk.end{background:#CFCFC9}
.mk.home{background:#1A1A1A}
.leaflet-popup-content{font-size:12.5px;line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 0 44px;line-height:1.9}
.legend{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:right}
</style>
</head>

const HOME=[39.994156,116.429890];
const SEEN_KEY="bj_exhib_seen_v1";
const SKIP_KEY="bj_exhib_skip_v1";  /* 不看了：整张卡片从列表里消失，地图上也不再打点 */

/* ---------- 时间与紧迫度 ---------- */
function dueOf(e){ return e.due||e.end; }
function dLeft(endISO){
  const a=new Date(endISO+"T00:00:00");
  const b=new Date(); b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}
function lv(d){
  if(d<0) return "ended";
  if(d===0) return "last";
  if(d<=3) return "urgent";
  if(d<=7) return "soon";
  if(d<=14) return "mid";
  return "calm";
}
const LVNAME={last:"今天最后一天",urgent:"urgent",soon:"soon",mid:"mid",calm:"calm"};
function badgeText(d){
  if(d<0) return "已结束";
  if(d===0) return "今天最后一天";
  return "还剩 "+d+" 天";
}
function fmtDate(iso){
  const p=iso.split("-");
  return Number(p[1])+"月"+Number(p[2])+"日";
}
function getSeen(){ try{return JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")}catch(e){return []} }
function setSeen(a){ try{localStorage.setItem(SEEN_KEY,JSON.stringify(a))}catch(e){} }
function getSkip(){ try{return JSON.parse(localStorage.getItem(SKIP_KEY)||"[]")}catch(e){return []} }
function setSkip(a){ try{localStorage.setItem(SKIP_KEY,JSON.stringify(a))}catch(e){} }

/* ---------- 排序：未看过的按结束日升序 → 看过的 → 已结束 ---------- */
function sorted(){
  const seen=getSeen(), skip=getSkip();
  return EVENTS.map(e=>({e:e,d:dLeft(dueOf(e)),seen:seen.indexOf(e.id)>=0,skip:skip.indexOf(e.id)>=0}))
    .sort((a,b)=>{
      const ga=a.d<0?2:(a.seen?1:0), gb=b.d<0?2:(b.seen?1:0);
      if(ga!==gb) return ga-gb;
      if(ga===2) return b.d-a.d;
      return a.d-b.d;
    });
}

/* ---------- 顶部面板 ---------- */
function renderDash(){
  const now=new Date();
  const wd=["周日","周一","周二","周三","周四","周五","周六"][now.getDay()];
  const rows=sorted().filter(x=>x.d>=0&&!x.skip);
  const next=rows[0];
  let html='<div class="today">今天 <b>'+(now.getMonth()+1)+' 月 '+now.getDate()+' 日 '+wd+'</b> · 可看 <b>'+rows.length+'</b> 场</div>';
  if(next){
    html+='<div class="nextup"><span class="dot"></span>最该先去 <b>'+next.e.t.split(" · ")[0]+'</b>（'+badgeText(next.d)+'）</div>';
  }
  document.getElementById("dash").innerHTML=html;
}

function updateFilters(){
  const a=sorted();
  const live=function(x){return !x.skip};
  const c={
    all:a.filter(x=>x.d>=0&&!x.seen&&live(x)).length,
    week:a.filter(x=>x.d>=0&&!x.seen&&live(x)&&x.d<=7).length,
    two:a.filter(x=>x.d>=0&&!x.seen&&live(x)&&x.d<=14).length,
    free:a.filter(x=>x.d>=0&&!x.seen&&live(x)&&x.e.tags.indexOf("free")>=0).length,
    need:a.filter(x=>x.d>=0&&!x.seen&&live(x)&&x.e.tags.indexOf("need")>=0).length,
    seen:a.filter(x=>x.seen&&live(x)).length,
    skip:a.filter(x=>x.skip).length,
    ended:a.filter(x=>x.d<0&&live(x)).length
  };
  document.querySelectorAll("#filters button").forEach(function(b){
    const sp=b.querySelector(".c"); if(sp) sp.textContent=c[b.dataset.f]||0;
    if(b.dataset.f==="skip") b.style.display=c.skip?"":"none";   /* 一场都没跳过就不显示这个页签 */
  });
}

/* ---------- 卡片 ---------- */
let filter="all";
function visible(x){
  if(filter==="all") return x.d>=0 && !x.seen && !x.skip;
  if(filter==="week") return x.d>=0 && !x.seen && !x.skip && x.d<=7;
  if(filter==="two") return x.d>=0 && !x.seen && !x.skip && x.d<=14;
  if(filter==="free") return x.d>=0 && !x.seen && !x.skip && x.e.tags.indexOf("free")>=0;
  if(filter==="need") return x.d>=0 && !x.seen && !x.skip && x.e.tags.indexOf("need")>=0;
  if(filter==="seen") return x.seen && !x.skip;
  if(filter==="skip") return x.skip;
  if(filter==="ended") return x.d<0 && !x.skip;
  return true;
}
function amapWeb(lng,lat,name,mode){
  return "https://uri.amap.com/navigation?to="+lng+","+lat+","+encodeURIComponent(name)
    +"&mode="+(mode||"car")+"&policy=1&src=yanghuidong&coordinate=gaode&callnative=1";
}
function navName(e){ return (e.venue.split(" · ")[0]||e.t.split(" · ")[0]); }
function navBtn(e){
  const n=navName(e);
  return '<a class="navbtn" href="'+amapWeb(e.ll[1],e.ll[0],n)+'" data-lng="'+e.ll[1]+'" data-lat="'+e.ll[0]+
    '" data-name="'+n.replace(/"/g,"&quot;")+'" target="_blank" rel="noopener">🧭 高德导航</a>';
}
function openAmapApp(lng,lat,name){
  const ua=navigator.userAgent.toLowerCase();
  const isIOS=/iphone|ipad|ipod/.test(ua);
  const q="dlat="+lat+"&dlon="+lng+"&dname="+encodeURIComponent(name)+"&dev=0&t=0";
  const scheme=isIOS ? "iosamap://path?sourceApplication=yanghuidong&"+q
                     : "amapuri://route/plan/?sourceApplication=yanghuidong&"+q;
  const t0=Date.now();
  window.location.href=scheme;
  setTimeout(function(){ if(!document.hidden && Date.now()-t0<2000) window.location.href=amapWeb(lng,lat,name); },1200);
}
let posterOwner={};
function cardHtml(x,i){
  const e=x.e, l=lv(x.d);
  const u=(x.d>=0&&x.d<=3)?" hot":((x.d>=0&&x.d<=7)?" soon":"");
  const price=[e.price];
  if(e.tags.indexOf("need")>=0 && e.price.indexOf("预约")<0) price.push("需预约");
  if(e.kind) price.push(e.kind);
  const fin=x.d<0?"已结束":(x.d===0?"今天最后一天":badgeText(x.d)+" · "+(e.dueLabel||fmtDate(e.end)+" 结束"));
  return '<div class="card lv-'+l+(x.d<0?' ended':'')+(x.seen?' seen':'')+(x.skip?' skip':'')+'" data-id="'+e.id+'" data-i="'+i+'">'
    +'<h3>'+(x.d<0||x.seen||x.skip?'':'<span class="num">'+(i+1)+'</span>')+e.t+'</h3>'
    +'<div class="fin'+u+'">'+fin+'</div>'
    +'<div class="meta"><span class="when">'+e.period+'</span><br>📍 '+e.venue+'</div>'
    +'<div class="tags">💰 '+price.join(" · ")+'</div>'
    +'<div class="traffic">🚇 '+e.transit+' ｜ 🚲 '+e.bike+' ｜ 🚕 '+e.taxi+'</div>'
    +'<div class="note">'+e.note+'</div>'
    +((e.poster&&posterOwner[e.poster]===e.id)?'<a class="poster" href="'+(e.posterFull||e.poster)+'" target="_blank" rel="noopener"><img src="'+e.poster+'" alt="活动海报" loading="lazy"></a>':'')
    +'<div class="acts">'
      +'<button class="seenbtn">'+(x.seen?"✓ 看过了":"标记看过")+'</button>'
      +(x.d<0||x.skip?'':navBtn(e))
      +'<button class="skipbtn">'+(x.skip?"← 放回列表":"不看了")+'</button></div>'
    +'</div>';
}
function render(){
  const all=sorted();
  posterOwner={};
  all.forEach(function(x){ const p=x.e.poster; if(p && !(p in posterOwner)) posterOwner[p]=x.e.id; });
  const live=all.filter(function(x){return !x.skip});        /* 「不看了」不占号，编号始终连着 */
  const idx={}; live.forEach(function(x,i){idx[x.e.id]=i});
  const list=all.filter(visible);
  const g=document.getElementById("grid");
  if(!list.length){ g.innerHTML='<div class="empty">这一类里暂时没有可看的内容。</div>'; }
  else{ g.innerHTML=list.map(function(x){return cardHtml(x,idx[x.e.id])}).join(""); }
  renderDash();
  updateFilters();
  const skipN=all.filter(function(x){return x.skip}).length;
  syncMap();
  const foot=document.getElementById("foot");
  const act=all.filter(function(x){return x.d>=0&&!x.skip}).length;
  const end=all.filter(function(x){return x.d<0&&!x.skip}).length;
  foot.innerHTML="共 "+EVENTS.length+" 场 · 可看 "+act+" 场 · 已结束 "+end+" 场"+(skipN?" · 不看了 "+skipN+" 场":"")
    +"<br>数据来自小红书截图／活动海报提取，出行前请以官方渠道为准";
}

document.getElementById("filters").addEventListener("click",function(ev){
  const b=ev.target.closest("button[data-f]"); if(!b) return;
  document.querySelectorAll(".filters button").forEach(function(x){x.classList.remove("on")});
  b.classList.add("on"); filter=b.dataset.f; render();
});

/* ---------- 地图 ---------- */
const map=L.map("map").setView([39.95,116.38],11);
L.tileLayer("https://webrd04.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}",{maxZoom:18,attribution:"© 高德地图"}).addTo(map);
const markers={};
function onMap(e){
  return dLeft(dueOf(e))>=0 && getSkip().indexOf(e.id)<0;   /* 已结束的和「不看了」的一律不上图 */
}
function makeMarker(e){
  const d=dLeft(dueOf(e));
  const icon=L.divIcon({className:"",html:'<div class="mk'+(d<=3?" hot":(d<=7?" soon":"")) +'">'+(e.kind?e.kind.charAt(0):(e.t.indexOf("书市")>=0?"书":"展"))+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
  return L.marker(e.ll,{icon:icon})
    .bindPopup("<b>"+e.t+"</b><br>🗓 "+e.period+"<br><span style='color:#e64a19'>"+badgeText(d)+"</span><br>📍 "+e.venue+"<br>💰 "+e.price
      +'<br><a href="'+amapWeb(e.ll[1],e.ll[0],navName(e))+'" target="_blank" rel="noopener">🧭 高德导航</a>');
}
function syncMap(){
  EVENTS.forEach(function(e){
    const want=onMap(e), have=markers[e.id];
    if(want&&!have) markers[e.id]=makeMarker(e).addTo(map);
    else if(!want&&have){ map.removeLayer(have); delete markers[e.id]; }
  });
}
syncMap();
L.marker(HOME,{icon:L.divIcon({className:"",html:'<div class="mk home">★</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindPopup("家 · 世纪村三区");

document.getElementById("grid").addEventListener("click",function(ev){
  const nb=ev.target.closest(".navbtn");
  if(nb){ ev.preventDefault(); ev.stopPropagation(); openAmapApp(nb.dataset.lng,nb.dataset.lat,nb.dataset.name); return; }
  const c=ev.target.closest(".card"); if(!c) return;
  const id=c.dataset.id;
  if(ev.target.classList.contains("seenbtn")){
    const seen=getSeen(); const k=seen.indexOf(id);
    if(k>=0) seen.splice(k,1); else seen.push(id);
    setSeen(seen); render(); return;
  }
  if(ev.target.classList.contains("skipbtn")){
    const skip=getSkip(); const k=skip.indexOf(id);
    if(k>=0) skip.splice(k,1);
    else{
      skip.push(id);
      const seen=getSeen(); const j=seen.indexOf(id);   /* 跳过的不算看过了 */
      if(j>=0){ seen.splice(j,1); setSeen(seen); }
    }
    setSkip(skip);
    if(filter==="skip"&&!skip.length){   /* 都放回完了就回到「全部」 */
      filter="all";
      document.querySelectorAll(".filters button").forEach(function(x){x.classList.toggle("on",x.dataset.f==="all")});
    }
    render(); return;
  }
  const m=markers[id]; if(!m) return;
  document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"});
  setTimeout(function(){ map.invalidateSize(); map.setView(m.getLatLng(),14,{animate:true}); m.openPopup(); },450);
});

render();
</script>
