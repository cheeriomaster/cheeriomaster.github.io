僧揭谛\">波罗僧揭谛</a>，<a class=\"w\" data-w=\"菩提\">菩提</a><a class=\"w\" data-w=\"萨婆诃\">萨婆诃</a>。", "jie_html": "<p>咒的五步是同一词根的一串递进：去、去、到彼岸去、彻底到彼岸去、觉。汉译全部音译——玄奘\"五不翻\"里的\"秘密故不翻\"：咒不译义，只记音，让念的人守着声音本身。所以这一句里没有一个字承担\"意思\"，每个字都是音节；要解释只能解释记音，不能翻译。</p>", "links": ["揭谛", "揭谛", "波罗揭谛", "波罗僧揭谛", "菩提", "萨婆诃"], "anchor": "s-3-8"}], "cards": {"五蕴": {"词": "五蕴", "句": "3.1", "梵文": "pañca-skandhān", "天城体": "पञ्चस्कन्धान्", "原形": "pañca + skandha", "形式": "阳性名词，业格复数", "状态": "初稿", "body_html": "<p><em>skandha</em> 的字面是\"聚、堆、块\"。五蕴不是五种东西，是<strong>五种聚拢</strong>：色受想行识，每一个都把无数刹那打包成一个看起来完整的\"块\"。中文\"蕴\"本来也有积聚义（蕴蓄），这个字选得准。</p>\n<p>这里有一个真正的校勘点：<em>pañca-skandhān</em> 是<strong>业格</strong>——五蕴是\"照见\"的宾语。Conze 早先把它处理成主格，结果第一句在梵文里语法不通（那谁在照见？照见了什么？）。现存写本、藏译、汉译一致支持业格读法。</p>\n<p>不是学究细节：按主格读，\"五蕴\"变成一个抽象命题；按业格读，\"五蕴\"是<strong>被观察的对象</strong>——修行的语法还留在句子里。</p>", "anchor": "w-五蕴", "evidence": [["梵文", "pañca-skandhān"], ["天城体", "पञ्चस्कन्धान्"], ["原形", "pañca + skandha"], ["形式", "阳性名词，业格复数"]]}, "度一切苦厄": {"词": "度一切苦厄", "句": "3.1", "梵文": "（现存梵本无对应文）", "天城体": "—", "原形": "—", "形式": "—", "异文": "现存梵文本无此句；鸠摩罗什系早期汉译亦无；多判为后补", "状态": "初稿", "body_html": "<p>这句话在<strong>现存梵文本里没有对应文</strong>，鸠摩罗什系的早期汉译也没有。多数研究判它是后补，或依别本增入。</p>\n<p>两件事同时成立，不必二选一：</p>\n<ul>\n<li>在义理上，它是整部经的落脚——\"照见\"不是为得一个知解，是为度苦。少了这五个字，全句就只剩一个观察报告。</li>\n<li>在版本上，它是很晚才走到这一行的。</li>\n</ul>\n<p>不必为了护它去说梵本有它，也不必因为梵本无就说它是赘句。汉译是这条链上独立而更早的见证，不是等着被梵文核对的译本——这条在本页开头就写着。</p>", "anchor": "w-度一切苦厄", "evidence": [["梵文", "（现存梵本无对应文）"], ["天城体", "—"], ["原形", "—"], ["形式", "—"]]}, "揭谛": {"词": "揭谛", "句": "3.8", "梵文": "gate gate", "天城体": "गते गते", "原形": "√gam → gata", "形式": "过去被动分词，-e 词尾", "状态": "初稿", "body_html": "<p><em>gate</em> 是 √<em>gam</em>（去、行）的过去分词 <em>gata</em> 加一个 <em>-e</em>。这个 <em>-e</em> 是《心经》研究里吵得最久的小问题之一：</p>\n<ul>\n<li>按古典梵文，<em>gate</em> 只能是阴性主格单数（那就得对应 <em>prajñā</em>，读成\"已去的智慧\"）或阳／中性双数（前面没有两个对象，不通）。两种都别扭。</li>\n<li>目前被广泛接受的解释（Cohen、Attwood）：这个 <em>-e</em> 是<strong>中期印度语／Prakrit 的阳性主格单数</strong>词尾，即 <em>gate</em> ＝ 梵文 <em>gataḥ</em>，\"（它／他）已去、已到\"。北印度碑铭里这种形态很常见。</li>\n</ul>\n<p>所以咒文不是病句，只是不属于古典梵文语法。传统读法（印顺《心经》讲记一路）把 <em>gate</em> 读作呼格／祈使\"度！度！\"，方向一致：都是\"过去了\"。</p>\n<p>「揭谛」是 7 世纪长安话对 <em>gate</em> 的记音，今天读 jiēdì 已经对不上。想念准就照 IAST：<em>ga-te</em> 两个音节，<em>g</em> 是软腭不送气清音，<em>t</em> 是<strong>卷舌</strong>音。</p>", "anchor": "w-揭谛", "evidence": [["梵文", "gate gate"], ["天城体", "गते गते"], ["原形", "√gam → gata"], ["形式", "过去被动分词，-e 词尾"]]}, "波罗僧揭谛": {"词": "波罗僧揭谛", "句": "3.8", "梵文": "pārasaṃgate", "天城体": "पारसंगते", "原形": "pāra + saṃ- + gata", "形式": "复合过去分词，-e 词尾", "状态": "初稿", "body_html": "<p>这句里那个\"僧\"字：**它是前缀 <em>saṃ-</em>（完全、普遍、一起），跟僧团 <em>saṃgha</em> 没有关系。** 意思就是\"彻底地、普遍地到了彼岸\"，比上一句只多了这个前缀的分量。</p>\n<p>玄奘译咒常拿现成的佛家字凑音（同类还有下文 <em>svāhā</em> 用「薩婆」）。结果一千多年来不断有人在这一句里读出僧团、读出三宝。</p>\n<p><strong>这是音译卡的通病：记音字自带义，读者忍不住去会意。</strong> 而这一处是最典型的样本——一个字，把整句从\"彻底到彼岸\"读成了\"僧团到彼岸\"。</p>", "anchor": "w-波罗僧揭谛", "evidence": [["梵文", "pārasaṃgate"], ["天城体", "पारसंगते"], ["原形", "pāra + saṃ- + gata"], ["形式", "复合过去分词，-e 词尾"]]}, "波罗揭谛": {"词": "波罗揭谛", "句": "3.8", "梵文": "pāragate", "天城体": "पारगते", "原形": "pāra + gata", "形式": "复合过去分词，-e 词尾", "状态": "初稿", "body_html": "<p>彼岸 + 已到：\"到彼岸去。\"</p>\n<p><em>pāra</em> 同时是\"对岸\"和\"最远处、尽头\"。所以这一层不只是\"渡过河\"，还带\"到了头\"的意思——前一个 <em>gate</em> 是\"去了\"，这一个多了方向与终点。</p>\n<p>顺带说一句字形：「波罗」两个字带水旁，跟\"到彼岸\"的意象天然咬合。汉地把 <em>pāramitā</em> 想象成大海，一半是这个译字给的。译场的选字从来不只是记音。</p>", "anchor": "w-波罗揭谛", "evidence": [["梵文", "pāragate"], ["天城体", "पारगते"], ["原形", "pāra + gata"], ["形式", "复合过去分词，-e 词尾"]]}, "深": {"词": "深", "句": "3.1", "梵文": "gambhīrāṃ", "天城体": "गम्भीराम्", "原形": "gambhīra", "形式": "形容词，阴性业格单数", "状态": "初稿", "body_html": "<p>\"深\"修饰的<strong>不是般若，是行</strong>：<em>gambhīrāṃ caryāṃ</em>——\"那种深奥的行\"。汉译语序\"行深般若波罗蜜多时\"把\"深\"推到了般若旁边，中文读者自然就读成\"般若很深\"。</p>\n<p>写本本身在这里有分歧：另有 <em>gambhīreṇa</em>（工具格）、<em>gambhīre prajñāpāramitāyāṃ</em>（处格）等读法，详见第五章第 4 条。</p>\n<p>但即便只按最通行的读本，两种读法给的也不是同一件事：说\"<strong>法</strong>很深\"是赞叹对象，说\"<strong>行</strong>很深\"是指功夫的纵深。前者让你敬畏这部经，后者让你检查自己修到了哪一层。</p>", "anchor": "w-深", "evidence": [["梵文", "gambhīrāṃ"], ["天城体", "गम्भीराम्"], ["原形", "gambhīra"], ["形式", "形容词，阴性业格单数"]]}, "照见": {"词": "照见", "句": "3.1", "梵文": "vyavalokayati sma … paśyati sma", "天城体": "व्यवलोकयति स्म … पश्यति स्म", "原形": "√lok（加 vi-、ava-）；√dṛś", "形式": "动词，现在时第三人称单数 + 习惯助词 sma", "状态": "初稿", "body_html": "<p><strong>\"照\"是译者加的，梵文这两个动词里没有光。</strong> <em>vi-ava-√lok</em> 是\"逐一地、向下地分辨察看\"，<em>paś-</em>（√<em>dṛś</em>）是\"看见\"。玄奘用\"照见\"，把镜照、光照的意象装了进来——对象不是被推理出来的，是被<strong>明明白白现前</strong>的。汉传后来讲\"观\"、讲止观、讲\"朗照\"，入口都在这个字上。</p>\n<p>还有 <em>sma</em>：表过去习惯的助词。动词是现在时 + <em>sma</em>，意思是\"（每当…时）就常在观察\"。汉译用一个\"时\"字承接，读起来像一次性的经历，梵文写的其实是<strong>一个反复在做这件事的人</strong>。</p>", "anchor": "w-照见", "evidence": [["梵文", "vyavalokayati sma … paśyati sma"], ["天城体", "व्यवलोकयति स्म … पश्यति स्म"], ["原形", "√lok（加 vi-、ava-）；√dṛś"], ["形式", "动词，现在时第三人称单数 + 习惯助词 sma"]]}, "空": {"词": "空", "句": "3.1", "梵文": "svabhāva-śūnyān", "天城体": "स्वभावशून्यान्", "原形": "svabhāva + śūnya", "形式": "形容词，业格复数", "状态": "初稿", "body_html": "<p>本经第一个\"空\"字对应的是<strong>形容词</strong> <em>śūnya</em>（空的），不是名词 <em>śūnyatā</em>（空性）。\"照见五蕴皆空\"直译是\"照见五蕴，并且它们是以自性而为空的\"。</p>\n<p>差别要紧：形容词说的是<strong>这些东西没有自性</strong>；名词容易把\"空\"端成一个场所、一种境界。下一句\"是故空中无色\"的\"空\"就是名词的处格。中文两个\"空\"字长得一模一样，读过去很容易把\"无自性\"读成\"进入空里面\"。整个中观史上反复拉扯的，就是这个落差。</p>\n<p>另外：「皆」是汉译补足的量词，梵文只有 <em>tāṃś ca</em>（并且它们）。</p>", "anchor": "w-空", "evidence": [["梵文", "svabhāva-śūnyān"], ["天城体", "स्वभावशून्यान्"], ["原形", "svabhāva + śūnya"], ["形式", "形容词，业格复数"]]}, "般若波罗蜜多": {"词": "般若波罗蜜多", "句": "3.1", "梵文": "prajñāpāramitā", "天城体": "प्रज्ञापारमिता", "原形": "prajñā + pāramitā", "形式": "阴性复合名词", "状态": "初稿", "body_html": "<p><strong>音译卡。</strong> 四个字里两个词：<em>prajñā</em>（明辨、洞察）+ <em>pāramitā</em>（到彼岸／最极圆满）。</p>\n<p>为什么\"般若\"不译成\"智慧\"——传统给的理由是玄奘\"五不翻\"里的两条：生善故不翻（这词值得被敬）、含多义故不翻（义译只能挑一个义）。音译的好处是<strong>把选择权留给读者</strong>，义译是替你选好了。</p>\n<ul>\n<li><em>prajñā</em>：√<em>jñā</em>（知）加 <em>pra-</em>（向前、清楚地）。Monier-Williams 给的义项是 wisdom / intelligence / knowledge / discrimination / judgement。\"判断力、明辨\"这一层，中文\"智慧\"里基本没有。</li>\n<li><em>pāramitā</em>：两条词源并存——<em>pāra</em let cur=null;
function card(w){
  const c=DATA.cards[w]; if(!c) return;
  cur=w;
  const s=DATA.sentences.find(x=>x.id===c['句']);
  const ev=c.evidence.filter(e=>e[1]&&e[1]!=='—');
  $('#dbody').innerHTML=`
    <h3>${esc(c['词'])}</h3>
    <div class="dref">${esc(c['句'])}${s?' · '+esc(s.title):''}</div>
    ${ev.length?`<dl class="ev">${ev.map(([k,v],i)=>`<dt>${esc(k)}</dt><dd class="${k==='天城体'?'dv':''}">${esc(v)}</dd>`).join('')}</dl>`:''}
    ${c['异文']?`<p class="dvar">异文 · ${esc(c['异文'])}</p>`:''}
    ${c.body_html}
    ${s?`<p class="dref"><span data-jump="${s.anchor}" style="cursor:pointer;color:var(--accent);border-bottom:1px dotted">回到 ${esc(s.id)} 那一句 ↓</span></p>`:''}`;
  document.body.classList.add('open');
  $('#dbody').scrollTop=0;
  history.replaceState(null,'','#w-'+encodeURIComponent(w));
  const i=order.indexOf(w);
  $('#prev').style.visibility = i>0?'visible':'hidden';
  $('#next').style.visibility = i>=0&&i<order.length-1?'visible':'hidden';
}
function close(){document.body.classList.remove('open');history.replaceState(null,'',location.pathname+location.search)}

  const w=e.target.closest('[data-w]'); if(w){e.preventDefault();card(w.dataset.w);return}
  const j=e.target.closest('[data-jump]'); if(j){close();document.getElementById(j.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});return}

  if(m){$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',b===m));
    document.body.className='mode-'+m.dataset.mode;localStorage.setItem('xj-mode',m.dataset.mode);return}
  const fs=e.target.closest('[data-fs]');
  if(fs){let v=Math.min(1.4,Math.max(.8,(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||1)+0.06*fs.dataset.fs));
    document.documentElement.style.setProperty('--fs',v.toFixed(2));localStorage.setItem('xj-fs',v);return}
  if(e.target.closest('button[data-theme]')){const L=['paper','night','ink'],n=L[(L.indexOf(document.documentElement.dataset.theme)+1)%3];
    document.documentElement.dataset.theme=n;localStorage.setItem('xj-theme',n);
    document.querySelector('button[data-theme]').textContent={paper:'纸',night:'夜',ink:'墨'}[n];return}
  if(e.target.id==='close'||e.target.id==='scrim')close();
  if(e.target.id==='hide-stance'){$('.stance').style.display='none';localStorage.setItem('xj-stance','0');}
});
$('#prev').onclick=()=>{const i=order.indexOf(cur);if(i>0)card(order[i-1])};
$('#next').onclick=()=>{const i=order.indexOf(cur);if(i>=0&&i<order.length-1)card(order[i+1])};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();
  if(document.body.classList.contains('open')&&['ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();(e.key==='ArrowLeft'?$('#prev'):$('#next')).click()}});

const savedMode=localStorage.getItem('xj-mode');
if(savedMode){document.body.className='mode-'+savedMode;$$('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===savedMode))}
const savedFs=localStorage.getItem('xj-fs'); if(savedFs)document.documentElement.style.setProperty('--fs',savedFs);
const savedTheme=localStorage.getItem('xj-theme');
if(savedTheme){document.documentElement.dataset.theme=savedTheme;
  document.querySelector('button[data-theme]').textContent={paper:'纸',night:'夜',ink:'墨'}[savedTheme]}
if(localStorage.getItem('xj-stance')==='0')$('.stance').style.display='none';
render();
if(location.hash.startsWith('#w-'))card(decodeURIComponent(location.hash.slice(3)));
else if(location.hash.startsWith('#s-')){const el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
</script>
</body>
</html>
